name: Actualizar equipos desde Planning Center

on:
  schedule:
    - cron: "17 10 * * 1"   # lunes ~5-6am hora de Carolina del Norte
  workflow_dispatch:

permissions:
  contents: write

jobs:
  equipos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Revisar secretos
        env:
          PCO_APP_ID: ${{ secrets.PCO_APP_ID }}
          PCO_SECRET: ${{ secrets.PCO_SECRET }}
          EDIT_PASSWORD: ${{ secrets.EDIT_PASSWORD }}
        run: |
          for v in PCO_APP_ID PCO_SECRET EDIT_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Falta el secreto $v"; exit 1; fi
          done
      - name: Leer Planning Center y cifrar
        env:
          PCO_APP_ID: ${{ secrets.PCO_APP_ID }}
          PCO_SECRET: ${{ secrets.PCO_SECRET }}
          EDIT_PASSWORD: ${{ secrets.EDIT_PASSWORD }}
        run: python3 automatizacion/build.py --config ministerios.json --salida equipos.enc.json
      - name: Guardar
        run: |
          git config user.name "calendario-bot"
          git config user.email "actions@users.noreply.github.com"
          git add equipos.enc.json
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Equipos: actualización semanal desde Planning Center"
          git pull --rebase
          git push
